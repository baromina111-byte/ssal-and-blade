<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쌀과 칼 — 조선 미곡 상단기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23b5352b'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' font-weight='bold' text-anchor='middle' fill='%23fff6e2'%3E%E7%B1%B3%3C/text%3E%3C/svg%3E">
<meta name="description" content="임진왜란 말기, 남원의 평민 덕수가 쌀장사로 팔도의 거상이 되기까지. 무기 26자루와 24달의 장부. 브라우저에서 바로 시작합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="쌀과 칼 — 조선 미곡 상단기">
<meta property="og:description" content="임진왜란 말기, 남원의 평민 덕수가 쌀장사로 팔도의 거상이 되기까지. 무기 26자루와 24달의 장부. 브라우저에서 바로 시작합니다.">
<meta property="og:image" content="https://ssal-and-blade.vercel.app/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1a1610">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="frame">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="loading">
    <div class="seal">米</div>
    <h1>쌀과 칼</h1>
    <p class="sub">조선 미곡 상단기</p>
    <div class="bar"><i id="bar"></i></div>
    <p class="pct" id="pct">0%</p>
  </div>

  <p id="rotate">가로로 돌리면 화면이 꽉 찹니다</p>

  <div id="touch" hidden>
    <div class="pad">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowRight">▶</button>
    </div>
    <div class="acts">
      <button data-key="KeyD" class="b4">대시</button>
      <button data-key="KeyS" class="b3">방어</button>
      <button data-key="KeyW" class="b2">점프</button>
      <button data-key="KeyA" class="b1">공격</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
