<!doctype html><html lang="ko"><head><meta charset="utf-8">

<style>
:root{--ink:#171A1D;--soft:#5E6B72;--paper:#F7F5F0;--line:#E3DFD6;--accent:#03C75A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.7 Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 70px}
h1{font-size:22px;margin:0 0 6px;font-weight:800}
.sub{color:var(--soft);font-size:14px;margin-bottom:24px}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px;font-size:14.5px;color:var(--soft)}
.step b{color:var(--ink)}
.post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.post h2{font-size:17px;margin:0 0 14px;font-weight:800;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{flex:1;min-width:130px;border:0;border-radius:10px;padding:14px 16px;
 font:600 15px Pretendard,system-ui,sans-serif;cursor:pointer;background:var(--accent);color:#fff}
button.alt{background:var(--ink)}
button.done{background:#6FA87A}
button:active{transform:translateY(1px)}
a.go{display:block;text-align:center;margin-top:12px;padding:13px;border:1px solid var(--line);
 border-radius:10px;text-decoration:none;color:var(--ink);font-size:14.5px}
pre{display:none}

 :root{--ink:#F5F4EF;--soft:#A9A8A2;--paper:#121211;--line:#2A2926}

 a.go{color:var(--ink)}
}
</style></head><body><div class="wrap">
<h1>네이버 블로그 붙여넣기</h1>
<div class="sub">버튼을 누르면 복사됩니다. 네이버 에디터에 붙여넣으세요.</div>
<div class="step"><b>순서</b> — ① 제목 복사 → 네이버 제목칸에 붙여넣기 ② 본문 복사 → 본문칸에 붙여넣기
③ 사진은 <b>직접 찍은 것</b>으로 3~4장 넣기 ④ 발행<br><br>
<b>왜 직접 찍은 사진인가</b> — 검색엔진은 다른 데서 본 이미지를 압니다. 폰으로 찍어도 충분합니다.</div>
<div id="list"></div>
</div>
<script>
const POSTS = [{"file": "01-룸스프레이-디퓨저-차이.txt", "title": "룸스프레이랑 디퓨저, 뭐가 다른가요 (사기 전에 5분만)", "body": "─────────────\n\n집들이 선물을 고르다가, 아니면 새로 이사한 집 현관 냄새가 신경 쓰여서\n검색하셨을 겁니다. 둘 다 향을 내는 물건인데 값도 비슷하고 설명도 비슷해서\n뭘 사야 할지 모르겠으실 거예요.\n\n결론부터 말씀드리면 지속시간과 강도가 다릅니다. 이 한 줄만 알고 계셔도\n고르는 게 쉬워집니다.\n\n■ 한 줄 요약\n\n· 언제 향이 나나 — 룸스프레이: 뿌린 즉시 / 리드 디퓨저: 놓아두면 계속\n· 얼마나 가나 — 룸스프레이: 30분 ~ 2시간 / 리드 디퓨저: 3 ~ 4개월\n· 세기 — 룸스프레이: 강하다 / 리드 디퓨저: 은근하다\n· 조절 — 룸스프레이: 내가 정한다 / 리드 디퓨저: 스틱 수로만\n· 손이 가나 — 룸스프레이: 매번 뿌려야 / 리드 디퓨저: 두 주에 한 번 뒤집기\n\n룸스프레이는 필요할 때 켜는 스위치고, 디퓨저는 켜 놓는 조명입니다.\n\n■ 그래서 놓는 자리가 다릅니다\n\n[ 룸스프레이가 맞는 곳 ]\n\n현관. 문을 열었을 때의 첫인상은 몇 초 만에 정해집니다. 손님 오기 5분 전에\n두 번 뿌리는 것으로 충분해요. 여기에 디퓨저를 두면 정작 필요한 그 순간에\n아무 일도 안 일어납니다.\n\n화장실. 여기는 강도가 필요합니다. 은근한 향으로는 덮이지 않아요.\n\n손님이 오기 직전의 거실. 평소엔 안 쓰다가 그때만 씁니다.\n\n[ 디퓨저가 맞는 곳 ]\n\n거실. 늘 사람이 있는 자리니까 늘 나는 향이 맞습니다.\n\n침실. 다만 약하게 놓으세요. 자는 동안 계속 맡는 향이라 강하면\n오히려 잠을 방해합니다. 스틱을 절반만 꽂으시면 됩니다.\n\n책상이나 선반. 향 말고도 놓여 있는 모양이 하는 일이 있습니다.\n\n■ 흔한 실수 세 가지\n\n① 침실에 강한 룸스프레이\n\n가장 많이 하시는 실수입니다. 자기 전에 뿌리면 향이 30분 만에 훅 올라왔다가\n빠지는데, 그 30분이 잠드는 시간과 겹칩니다. 침실은 디퓨저 쪽입니다.\n\n② 환기 안 되는 방에 디퓨저\n\n디퓨저는 공기가 아주 조금이라도 움직여야 퍼집니다. 창문 없는 방에 두면\n그 자리 반경 50cm만 향이 나고 방 전체는 그대로예요. 이럴 땐 룸스프레이입니다.\n\n③ 스틱을 안 뒤집는 것\n\n이걸 모르시는 분이 정말 많습니다. 리드 스틱은 두 주에 한 번 뒤집어야\n합니다. 안 뒤집으면 위쪽이 말라서, 오일은 절반이나 남았는데 향은 안 나는\n상태가 됩니다. \"디퓨저 금방 끝나더라\"는 대부분 이겁니다.\n\n■ 얼마나 쓰나 — 실제 계산\n\n룸스프레이 100ml\n\n한 번 뿌릴 때 약 0.15ml가 나갑니다. 하루 두 번이면 0.3ml, 한 달에 9ml.\n두 달 정도 갑니다. 현관에만 쓰시면 서너 달도 갑니다.\n\n리드 디퓨저 200ml\n\n스틱 6개 기준 3~4개월. 스틱을 늘리면 향은 세지고 그만큼 빨리 없어집니다.\n8개 꽂으면 두 달 반, 4개면 다섯 달쯤이라고 보시면 됩니다.\n\n여름엔 더 빨리 없어집니다. 온도가 높으면 증발이 빨라지니까요.\n\n■ 그럼 뭘 사야 하나요\n\n둘 중 하나만 고르셔야 한다면 — 사시는 공간의 크기로 정하세요.\n\n· 원룸·오피스텔이면 룸스프레이. 공간이 작아서 한 번 뿌리면 방 전체가 됩니다\n· 방이 여러 개면 디퓨저를 거실에. 뿌리러 다닐 수 없으니까요\n\n선물이라면 디퓨저입니다. 받는 사람이 아무것도 안 해도 되고, 놓여 있는\n모양도 선물 같습니다.\n\n■ 향은 어떻게 고르나\n\n이건 다음 글에서 자세히 다루겠지만, 하나만 미리 말씀드리면\n시향지에서 좋았던 향과 집에 놓았을 때 좋은 향은 다릅니다.\n시향지는 30초를 맡고, 집에서는 하루 종일 맡으니까요.\n\n선물이나 첫 구매라면 우디나 머스크 계열이 안전합니다. 호불호가 가장 적어요.\n강한 플로럴이나 단 향은 취향을 많이 탑니다.\n\n─────────────\n\n저희 코모브 (https://commov-seoul-niche-midnight.vercel.app/)는 같은 향을\n룸스프레이·섬유향수·리드디퓨저 세 형태로 냅니다. 자리마다 맞는 형태가 다르다는\n게 이 글의 요지인데, 향까지 달라지면 집 안에서 향이 섞이거든요. 세 가지 다\n한 개 59,800원입니다."}, {"file": "02-향수노트-읽는법.txt", "title": "향수 노트 읽는 법 — 탑·미들·베이스가 실제로 뜻하는 것", "body": "─────────────\n\n백화점에서 시향지에 뿌려 맡았을 때 분명히 좋았는데, 사서 집에 와서 뿌리니까\n전혀 다른 냄새가 났던 적 있으실 겁니다. 속은 것 같기도 하고, 내 코가 이상한가\n싶기도 하고요.\n\n속으신 게 아닙니다. 탑노트만 맡고 사셨을 뿐입니다.\n\n■ 향수는 세 번 바뀝니다\n\n향수병 안의 향료들은 무게가 다릅니다. 가벼운 것이 먼저 날아가고 무거운 것이\n나중까지 남습니다. 그래서 뿌린 뒤 시간에 따라 다른 향이 순서대로 올라옵니다.\n\n· 탑노트 — 언제: 0~30분 / 무엇이: 시트러스, 허브, 가벼운 과일 / 역할: 첫인상\n· 미들노트 — 언제: 30분~4시간 / 무엇이: 플로럴, 스파이스, 그린 / 역할: 본체\n· 베이스노트 — 언제: 4시간~ / 무엇이: 우디, 머스크, 앰버, 바닐라 / 역할: 잔향\n\n시향지에서 맡는 30초는 전부 탑노트입니다. 그런데 하루 중 향수가 실제로\n일하는 시간은 미들과 베이스예요. 회의 중에, 저녁 자리에서 사람들이 맡는 건\n탑노트가 아닙니다.\n\n■ 그래서 제대로 시향하는 법\n\n① 손목에 뿌리세요. 시향지 말고.\n\n시향지는 종이라 체온이 없습니다. 향은 체온으로 피어나기 때문에 종이에서 나는\n향과 피부에서 나는 향은 다릅니다. 같은 향수가 사람마다 다르게 난다는 말이\n여기서 나옵니다.\n\n② 비비지 마세요.\n\n뿌리고 손목을 비비는 분이 많은데, 그러면 마찰열로 탑노트가 한꺼번에\n날아갑니다. 향의 구조가 깨져요. 그냥 두세요.\n\n③ 30분 뒤에 판단하세요.\n\n이게 핵심입니다. 뿌리고 매장을 한 바퀴 돌거나, 아예 나갔다가 30분 뒤에\n맡아보세요. 그때 나는 향이 앞으로 몇 시간 동안 날 향입니다.\n\n④ 하루에 세 개 이상 맡지 마세요.\n\n코가 지칩니다(후각 피로). 네 번째부터는 구별이 안 돼요. 커피 원두를 맡으면\n초기화된다는 말이 있는데, 실은 별 효과 없습니다. 그냥 다음날 오세요.\n\n■ 계절과 체온이 바꾸는 것\n\n여름엔 향이 빨리 날아가고 강하게 퍼집니다. 온도가 높으면 증발이 빠르니까요.\n그래서 여름엔 겨울에 쓰던 양의 절반만 뿌려도 비슷하게 느껴집니다.\n겨울엔 반대로 향이 잘 안 퍼져서 한 번 더 뿌리게 됩니다.\n\n체온이 높은 사람은 향이 세게 납니다. 본인은 익숙해져서 모르는데 옆 사람은\n강하게 느낍니다. 뿌리는 양은 남의 기준으로 정하는 게 맞습니다.\n\n■ 노트 이름이 어려울 때\n\n향수 설명에 나오는 말들을 대충이라도 알아두면 고르기가 훨씬 쉽습니다.\n\n· 시트러스 — 레몬, 베르가못, 자몽. 가볍고 상쾌. 거의 다 탑노트\n· 우디 — 시더우드, 샌달우드, 베티버. 마른 나무. 차분하고 오래 감\n· 머스크 — 살냄새에 가까운 부드러움. 호불호가 가장 적음\n· 앰버 — 따뜻하고 달큰한 잔향. 겨울에 잘 어울림\n· 아쿠아틱 — 물, 바다, 미네랄. 깨끗한 인상\n· 그린 — 풀, 잎, 줄기를 자른 냄새\n\n처음 사시는 거라면 우디나 머스크를 권합니다. 어디에 뿌려도 무난하고,\n사무실에서도 문제되지 않습니다.\n\n■ 지속시간을 결정하는 것 — 부향률\n\n향수 이름 뒤에 붙은 말이 농도입니다.\n\n· 오 드 코롱 (EDC) — 부향률: 2~5% / 지속: 1~2시간\n· 오 드 뚜왈렛 (EDT) — 부향률: 5~15% / 지속: 3~4시간\n· 오 드 퍼퓸 (EDP) — 부향률: 15~20% / 지속: 5~7시간\n· 퍼퓸 / 엑스트레 — 부향률: 20~40% / 지속: 하루\n\nEDT와 EDP는 가격 차이만큼 지속시간이 다릅니다. 하루에 두 번 덧뿌릴 생각이\n없으시면 EDP 쪽이 결국 이득입니다.\n\n■ 정리\n\n1. 시향지 말고 손목에\n2. 비비지 말고\n3. 30분 뒤에 판단\n4. 하루 세 개까지\n5. 처음이면 우디·머스크, 지속을 원하면 EDP\n\n이것만 지키셔도 \"사고 나서 후회하는\" 일은 거의 없어집니다.\n\n─────────────\n\n저희 코모브 (https://commov-shutter-bendav.vercel.app/)는 제품마다 노트를\n전부 공개합니다. 향은 등급의 문제가 아니라 취향의 문제라고 보기 때문입니다 —\n무엇으로 만들었는지 알면 자기한테 맞는지 미리 가늠할 수 있으니까요.\nSHUTTER는 100ml 오 드 퍼퓸, 부향률 15~20%, 59,800원입니다."}, {"file": "03-집들이선물-향.txt", "title": "집들이 선물로 향 제품 고를 때 실패하지 않는 법", "body": "─────────────\n\n집들이 초대를 받으면 제일 먼저 하는 고민이 이겁니다. 휴지나 세제는 성의 없어\n보이고, 그릇은 취향을 타고, 화분은 부담스럽고.\n\n그래서 향 제품으로 눈이 갑니다. 적당히 있어 보이고 값도 맞으니까요.\n다만 향 선물은 잘못 고르면 그 집 구석에 그대로 남습니다.\n\n실패하지 않는 기준을 정리했습니다.\n\n■ 향 선물이 위험한 이유\n\n향은 취향이 가장 크게 갈리는 물건입니다. 옷이나 그릇은 안 맞아도 \"쓸 수는\n있다\"인데, 향은 안 맞으면 아예 못 씁니다. 매일 맡아야 하니까요.\n\n게다가 받는 사람이 싫다고 말하기도 어렵습니다. 그래서 조용히 안 쓰게 됩니다.\n\n그럼에도 향 선물이 좋은 이유는, 맞았을 때 매일 생각난다는 점입니다.\n집에 들어올 때마다 나는 냄새는 그릇보다 훨씬 자주 존재감을 냅니다.\n\n■ 안전한 쪽과 위험한 쪽\n\n[ ✅ 안전한 쪽 ]\n\n우디 계열 — 시더우드, 샌달우드. 나무 냄새라 호불호가 거의 없습니다.\n남녀 구분도 없고, 거실에 두기 좋습니다.\n\n머스크 계열 — 부드럽고 살냄새에 가깝습니다. \"무슨 향이야?\"라고 묻지 않고\n그냥 좋다고 느끼는 쪽입니다.\n\n아쿠아틱·시트러스 — 깨끗한 인상. 신혼집이나 새 집에 특히 어울립니다.\n\n[ ⚠️ 위험한 쪽 ]\n\n강한 플로럴 — 장미, 튜베로즈, 자스민. 좋아하는 사람은 아주 좋아하고\n싫어하는 사람은 두통을 느낍니다. 취향을 확실히 아는 게 아니면 피하세요.\n\n단 향(구르망) — 바닐라, 카라멜, 초콜릿. 처음엔 좋은데 집 안에 계속 있으면\n답답해집니다. 특히 좁은 집에서 그렇습니다.\n\n너무 개성 강한 향 — 인센스, 가죽, 타바코. 본인이 쓰기엔 멋진데\n선물로는 도박입니다.\n\n향초 — 향 자체보다 불을 켜야 한다는 게 문제입니다. 아이나 반려동물이\n있는 집, 자주 비우는 집에서는 결국 안 켜게 됩니다.\n\n■ 가격대별로 기대할 수 있는 것\n\n· 2~3만원 — 뭘 받나: 룸스프레이 단품, 소용량 디퓨저 / 어울리는 관계: 여럿이 나눠 내거나, 가벼운 사이\n· 5~7만원 — 뭘 받나: 제대로 된 디퓨저, 니치 브랜드 단품 / 어울리는 관계: 가장 무난한 구간\n· 10만원 이상 — 뭘 받나: 세트 구성, 명품 라인 / 어울리는 관계: 아주 가까운 사이\n\n5~7만원이 실패가 가장 적은 구간입니다. 아래로 가면 성의가 보이고\n위로 가면 부담을 줍니다.\n\n■ 형태는 디퓨저가 안전합니다\n\n앞서 쓴 글에서 자세히 다뤘지만, 선물이라면 리드 디퓨저입니다.\n\n· 받는 사람이 아무것도 안 해도 됩니다. 놓기만 하면 돼요\n· 놓여 있는 모양이 선물 같습니다. 룸스프레이는 서랍에 들어갑니다\n· 3~4개월 갑니다. 그 기간 내내 존재감이 있습니다\n\n룸스프레이는 본인이 쓸 때는 좋은데, 선물로는 \"한 번 뿌리고 넣어두는\" 물건이\n되기 쉽습니다.\n\n■ 포장과 카드 — 절반입니다\n\n향 선물은 뜯는 순간이 절반입니다. 같은 제품도 포장에 따라 완전히 다르게\n느껴집니다.\n\n· 브랜드 자체 포장이 있으면 그걸 쓰세요. 따로 포장지를 덧씌우지 마세요\n· 카드 한 줄을 꼭 넣으세요. \"새 집 축하해\" 한 줄로 충분합니다\n· 향 설명을 적어주면 좋습니다 — \"나무 냄새 나는 향이야, 거실에 두면 좋대\"\n\n받는 사람이 어디에 둘지 바로 떠올릴 수 있게 해주는 게 포인트입니다.\n\n■ 마지막 — 물어봐도 됩니다\n\n가장 확실한 방법입니다. \"집들이 선물로 향 제품 생각 중인데 좋아하는 향 있어?\"\n라고 물으면 대부분 반가워합니다. 서프라이즈가 목적이 아니라면 물어보세요.\n\n정 물어보기 그러면, 우디 계열 디퓨저 5~7만원대로 가시면 됩니다.\n이 조합이 통계적으로 가장 안전합니다.\n\n─────────────\n\n저희 코모브 (https://commov-seoul-niche-midnight.vercel.app/)는 서울의 밤을\n담은 시그니처 하나를 공간·패브릭·리빙 세 형태로 냅니다. 우디와 머스크가 뼈대라\n호불호가 크지 않고, 세 가지 다 한 개 59,800원이라 위에 적은 안전 구간에 들어갑니다."}];
